.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

.iso-figure{margin:32px 0 36px}

.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}

.mr .iso-plate {

}

.mr-credit {
  position: absolute;
  top: 34px;

  font-family: var(--anatomy-mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  line-height: 1;
  pointer-events: none;
}

.mr-stage {
  position: relative;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  cursor: ew-resize;
  margin: 0 -8px;
}

.mr-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

.mr-stage > svg {
  display: block;
  width: 100%;
  height: auto;
}

.mr-said {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.mr-mud { fill: var(--mr-mud); fill-opacity: 0.55; stroke: none; }
.mr-pan { fill: var(--mr-pan); fill-opacity: 0.6; stroke: none; }
.mr-sub { fill: var(--mr-sub); fill-opacity: 0.45; stroke: none; }
.mr-stone { fill: var(--mr-stone); stroke: none; }
.mr-water { fill: var(--mr-water); fill-opacity: 0.42; stroke: none; }
.mr-water-face { fill-opacity: 0.55; }
.mr-arc { stroke: none; }
.mr-arc-mr { fill: var(--mr-arc-mr); fill-opacity: 0.85; }
.mr-arc-tall { fill: var(--mr-arc-tall); fill-opacity: 0.9; }

.mr-hill .leaf { stroke-width: 0.45; stroke-linejoin: round; }
.mr-hill .stem { fill: none; stroke-width: 0.7; stroke-linecap: round; }
.mr-hill .rachis { fill: none; stroke-width: 0.55; stroke-linecap: round; }
.mr-hill .grain { stroke-width: 0.3; }
.mr-hill .ring { fill: none; stroke: var(--anatomy-lo); stroke-width: 0.45; }
.mr-root { fill: none; stroke: var(--mr-root); stroke-width: 0.45; stroke-linecap: round; }
.mr-rain { stroke: var(--mr-rain); stroke-width: 0.55; stroke-linecap: round; fill: none; }
.mr-ripple { fill: none; stroke: var(--mr-rain); stroke-width: 0.4; }

.mr-table {
  width: 100%;
  margin: 10px 0 -18px;
  border-collapse: collapse;
  font-family: var(--anatomy-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--anatomy-text);
}

.mr-table th,
.mr-table td {
  padding: 4px 6px;
  text-align: right;
  font-weight: 400;
  border-top: 1px solid var(--anatomy-faint);
  white-space: nowrap;
}

.mr-table thead th {
  border-top: none;
  color: var(--anatomy-muted);
  vertical-align: bottom;
}

.mr-table thead th span {
  display: block;
  font-size: 9px;
  opacity: 0.8;
}

.mr-table tbody th {
  text-align: left;
  color: var(--anatomy-muted);
}

.mr-table td[data-cell^="mr-"] {
  color: var(--anatomy-strong);
}

@media (max-width: 560px) {
  .mr-credit { top: 32px; right: 12px; font-size: 8.5px; }
  .mr-stage { margin: 0 -10px; }
  .mr-table { font-size: 10px; }
  .mr-table th, .mr-table td { padding: 3px 3px; }
}

den="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Flood water, 7 cm deep</span></span><span class="iso-caption">MARDI declared MR219 in 2001. Older tall varieties grew 140–150 cm high on soft, hollow culms; once the panicles filled, wind and rain pushed them over (lodging) into the flood water, where the grain rots, sprouts or cannot be cut. MR219 is a semi-dwarf, about 56–90 cm, with stiff culms and short, erect leaves, so a heavy panicle bends its head but not the plant. It yields about 6–8 t/ha and matures in about 105–111 days from sowing, short enough for two crops a year in the granary areas, main season and off season. On the calendar wheel (January at the top) the gold arcs are MR219's two crops, main season from early September and off season from early March; the grey arc is the tall variety's single crop. Plants, soil and water are drawn to scale (1 unit = 1 cm; ruler ticks every 5 cm). The tall variety's height, 150-day season, 2.5 t/ha and its lodging are illustrative, and so are the grain loads, from yield at 16 hills/m² (25 × 25 cm).</span></figcaption></figure></div></main><script type="module">const AZIMUTH = 45;

const lodgedShare = (key) => {

// ------------------------------------------------------------ the tour: grow, gust, a year on the wheel, again
