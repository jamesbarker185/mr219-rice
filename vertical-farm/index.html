.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}

.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}

.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}

.iso-dots[data-tone="lo"] circle{opacity:.22}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

  --vf-on: #d4d4d4;
  --vf-off: #3a3a3a;
}

.vf .iso-plate {
  overflow: hidden;
}

.vf-credit {
  position: absolute;
  top: 34px;
  right: 20px;
  color: var(--anatomy-muted);
  font-family: var(--anatomy-mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  line-height: 1;
  pointer-events: none;
}

.vf-stage {
  position: relative;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  cursor: ew-resize;
  margin: 0 -8px;
}

.vf-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

.vf-stage > svg {
  display: block;
  width: 100%;
  height: auto;
}

.vf-said {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.vf-water { fill: var(--vf-water); fill-opacity: 0.45; stroke: none; }
.vf-water-deep { fill-opacity: 0.6; }
.vf-glow { stroke: none; pointer-events: none; }
.iso[data-theme="light"] .vf-glow { mix-blend-mode: multiply; }
.iso[data-theme="dark"] .vf-glow { mix-blend-mode: screen; }
.vf-led { fill: none; stroke: var(--vf-led); stroke-width: 1.3; stroke-linecap: round; }
.vf-lcd { fill: var(--vf-lcd); stroke: none; }
.vf-lcd-text { fill: var(--vf-lcd-ink); font-family: var(--anatomy-mono); letter-spacing: 0.04em; }
.vf-drip { fill: none; stroke: var(--vf-water); stroke-width: 0.7; stroke-linecap: round; }

.vf-plant .leaf { stroke-width: 0.4; stroke-linejoin: round; }
.vf-plant .rib { fill: none; stroke: var(--vf-rib); stroke-width: 0.35; stroke-linecap: round; opacity: 0.8; }

.vf-pin-on { fill: none; stroke: var(--vf-on); stroke-width: 1.1; stroke-linecap: round; }
.vf-pin-off { fill: none; stroke: var(--vf-off); stroke-width: 1.1; stroke-linecap: round; }

.vf-table {
  width: 100%;
  margin: 10px 0 -18px;
  border-collapse: collapse;
  font-family: var(--anatomy-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--anatomy-text);
}

.vf-table th,
.vf-table td {
  padding: 4px 6px;
  text-align: right;
  font-weight: 400;
  border-top: 1px solid var(--anatomy-faint);
  white-space: nowrap;
}

.vf-table thead th {
  border-top: none;
  color: var(--anatomy-muted);
  vertical-align: bottom;
}

.vf-table thead th span {
  display: block;
  font-size: 9px;
  opacity: 0.8;
}

.vf-table tbody th {
  text-align: left;
  color: var(--anatomy-muted);
}

.vf-table td[data-cell^="rack-"] {
  color: var(--anatomy-strong);
}

@media (max-width: 560px) {
  .vf-credit { top: 32px; right: 12px; font-size: 8.5px; }
  .vf-stage { margin: 0 -10px; }
  .vf-table { font-size: 9.5px; }
  .vf-table th, .vf-table td { padding: 3px 3px; white-space: normal; }
}

ath d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Rack, gullies, tank and cabinet</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>LED light and nutrient film</span></span><span class="iso-caption">Each tier carries 2 gullies of 9 butterhead lettuce (18 heads on 1.2 m²). Seedlings come from 14 days in a propagation cube and spend 28 days on the rack, growing to about 180 g. The tiers are planted 7 days apart, so one tier is cut and replanted every week and the rack never stands empty: 52 tier harvests a year, about 169 kg, or 141 kg per m² of floor against about 3.9 kg for field lettuce. A pump lifts the solution (EC 1.6 mS/cm, pH 5.9) to every gully; it runs down a 1 in 40 fall past the roots and back to the tank, so the rack uses about 20 L of water per kg instead of 250 L. The price is light: the LED bars give 250 µmol/m²/s for 16 h a day, a daily light integral of 14.4 mol/m², which at 2.7 µmol/J is about 1.5 kWh per m² of tier a day, or 15 kWh per kg of lettuce before cooling. Field and hydroponic yield and water figures are from Barbosa et al. (2015); head growth and mass are illustrative. Drawn to scale, 1 unit = 1 cm, ruler ticks every 5 cm.</span></figcaption></figure></div></main><script type="module">const AZIMUTH = 45;

    set("rack-harvests", `${cuts} of ${perYear}`);
    set("rack-yield", `${Math.round(kg / RACK_M2)} of ${Math.round(rackKgM2Year)} kg`);
    set("rack-light", `${DLI.toFixed(1)} mol/m², ${PHOTOPERIOD} h`);
    text = `${months} month${months === 1 ? "" : "s"} · ${cuts} tier cuts · ${Math.round(kg)} kg`;
  } else {
    set("rack-harvests", `${perYear}, a tier a week`);
    set("rack-yield", `${Math.round(rackKgM2Year)} kg`);
    if (dayRun >= 0) {
      const lit = lightAt(hour) > 0.5;
      set("rack-light", `${dliBy(h).toFixed(1)} of ${DLI.toFixed(1)} mol/m²`);
      text = `${part("lcd").textContent} · lights ${lit ? "on" : "off"} · ${dliBy(h).toFixed(1)} mol/m²`;
    } else {
      set("rack-light", `${DLI.toFixed(1)} mol/m², ${PHOTOPERIOD} h`);
      const dd = Math.round(day);
      const cuts = harvestsBy(day);
      const next = Math.min(...[0, 1, 2, 3].map((t) => GROW - ageOf(t, day)));
      text = `Day ${dd} · ${cuts ? `${cuts} tier${cuts === 1 ? "" : "s"} cut · ` : ""}next cut in ${Math.max(0, Math.round(next))} d`;
    }
  }
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuenow", String(Math.round(day)));
  stage.setAttribute("aria-valuetext", text);
}

// ------------------------------------------------------------ the tour: four weeks, a day on the timer, a year of cuts, again
const TOUR = { grow: 14, hold: 1.2, day: 8, after: 1.2, year: 12, rest: 2.5 };
let tour = { phase: "grow", t: 0 };
let touring = !still.matches;
function tourStep(dt) {
  tour.t += dt;
  if (tour.phase === "grow") {
    target = GROW * Math.min(1, tour.t / TOUR.grow) * 0.999;
    if (tour.t > TOUR.grow + TOUR.hold) { tour = { phase: "day", t: 0 }; startDay(); }
  } else if (tour.phase === "day") {
    if (dayRun < 0 && tour.t > TOUR.day + TOUR.after) { tour = { phase: "year", t: 0 }; startYear(); }
  } else if (tour.phase === "year") {
    if (yearT >= 365 && tour.t > TOUR.year + TOUR.rest) restart();
  }
}
function restart() {
  tour = { phase: "grow", t: 0 };
  yearT = -1;
  target = day = 0;
}
function startDay() {
  yearT = -1;
  dayRun = 0;
  hour = 12;
}
function startYear() {
  dayRun = -1;
  hour = 12;
  yearFrom = day;
  yearT = 0;
}

let frame = 0;
let last = 0;
let visible = false;
let idleTimer = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  if (touring) tourStep(dt);
  if (yearT < 0) {
    day = still.matches ? target : day + (target - day) * (1 - Math.exp(-dt / 0.25));
    if (Math.abs(target - day) < 0.005) day = target;
  }
  if (dayRun >= 0 && !held) {
    dayRun += (24 / TOUR.day) * dt;
    hour = 12 + Math.min(24, dayRun);
    if (dayRun >= 24) { dayRun = -1; hour = 12; }
  }
  if (yearT >= 0 && yearT < 365 && !held) {
    yearT = Math.min(365, yearT + (365 / TOUR.year) * dt);
    if (yearT >= 365) { day = (yearFrom + 365) % GROW; target = day; }
  }
  draw();
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const pause = () => {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!still.matches) { touring = true; yearT = -1; dayRun = -1; hour = 12; tour = { phase: "grow", t: (day / GROW) * TOUR.grow }; } run(); }, 4500);
};
const steer = (next) => {
  pause();
  if (yearT >= 0) { day = target = ((yearFrom + yearT) % GROW + GROW) % GROW; yearT = -1; }
  dayRun = -1;
  hour = 12;
  target = clampTo(next, 0, GROW);
  run();
};
const lightDay = () => {
  pause();
  if (yearT >= 0) { day = target = (yearFrom + yearT) % GROW; }
  startDay();
  if (still.matches) { dayRun = -1; hour = 23; draw(true); }
  run();
};
const year = () => {
  pause();
  startYear();
  if (still.matches) { yearT = 365; draw(true); }
  run();
};

stage.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch") return;
  const box = stage.getBoundingClientRect();
  const share = clampTo(((event.clientX - box.left) / box.width - 0.1) / 0.8, 0, 1);
  if (Math.abs(share * GROW - target) < 0.05 && (yearT >= 0 || dayRun >= 0)) return;
  steer(share * GROW * 0.999);
});
stage.addEventListener("pointerdown", (event) => {
  if (event.pointerType === "touch") {
    const box = stage.getBoundingClientRect();
    steer(clampTo(((event.clientX - box.left) / box.width - 0.1) / 0.8, 0, 1) * GROW * 0.999);
  }
});
stage.addEventListener("click", () => lightDay());
stage.addEventListener("keydown", (event) => {
  let to = null;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = target + 1;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = target - 1;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = GROW * 0.999;
  if (event.key === "l" || event.key === "L" || event.key === " ") { event.preventDefault(); lightDay(); said.textContent = "One day on the light timer: on at 06:00, off at 22:00"; return; }
  if (event.key === "y" || event.key === "Y") { event.preventDefault(); year(); said.textContent = `A year of harvests: ${Math.round(TIERS * cyclesPerYear)} tier cuts`; return; }
  if (to === null) return;
  event.preventDefault();
  steer(to);
  said.textContent = `Day ${Math.round(target)}`;
});
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

if (still.matches) {
  // One still picture: day 4, the four tiers a week apart in age, lights on.
  target = day = 4;
}
draw(true);
window.__vf = {
  get day() { return day; },
  setDay(d) { touring = false; yearT = -1; dayRun = -1; target = day = d; draw(true); },
  setHour(h) { touring = false; held = true; hour = h; dayRun = 0.01; draw(true); },
  setYear(t) { touring = false; held = true; yearFrom = day; yearT = t; draw(true); },
  set touring(v) { touring = v; },
};
</script></body></html>
